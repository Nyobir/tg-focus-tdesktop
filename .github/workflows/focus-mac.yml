name: Telegram Focus macOS

on:
  workflow_dispatch:
  push:
    branches: [focus]

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py

    steps:
      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: First set up.
        run: |
          brew install automake libtool meson nasm ninja pkg-config gnu-tar || true
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-${{ matrix.config }}-libs-${{ hashFiles(format('tdesktop/{0}', env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.config }}-libs-

      - name: Libraries.
        run: |
          if [ "${{ matrix.config }}" = Debug ]; then
            ./tdesktop/Telegram/build/prepare/mac.sh skip-release silent
          else
            ./tdesktop/Telegram/build/prepare/mac.sh silent
          fi

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Build.
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cd tdesktop/Telegram
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=${{ matrix.config }} \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_ID="$TG_API_ID" \
            -D TDESKTOP_API_HASH="$TG_API_HASH" \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            -D DESKTOP_APP_ENABLE_LTO=OFF
          cmake --build ../out --config ${{ matrix.config }} --parallel

      - name: Package (encrypted, the binary embeds the API keys).
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY"
          cd tdesktop/out/${{ matrix.config }}
          codesign --force --deep -s - Telegram.app
          ditto -c -k --keepParent Telegram.app app.zip
          openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -in app.zip -out TelegramFocus-${{ matrix.config }}.zip.enc -pass env:ARTIFACT_KEY
          rm app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TelegramFocus-${{ matrix.config }}
          path: tdesktop/out/${{ matrix.config }}/TelegramFocus-${{ matrix.config }}.zip.enc
          retention-days: 7
